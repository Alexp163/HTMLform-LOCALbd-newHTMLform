<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>start</title>
    <style>
        /* ---------- СБРОС И БАЗА ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(145deg, #f9faff 0%, #eef2fd 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        /* ---------- ПРИВЕТСТВИЕ ---------- */
        p {
            font-size: 1.7rem;
            font-weight: 600;
            color: #1b2a4e;
            letter-spacing: -0.02em;
            margin-bottom: 1.5rem;
            text-shadow: 0 2px 4px rgba(0, 20, 40, 0.05);
            background: rgba(255, 255, 255, 0.7);
            padding: 0.5rem 2rem;
            border-radius: 100px;
            backdrop-filter: blur(4px);
            box-shadow: 0 8px 20px -6px rgba(0, 30, 60, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.6);
        }

        /* ---------- ФОРМА (КАРТОЧКА) ---------- */
        form {
            width: 100%;
            max-width: 400px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 32px;
            padding: 2.2rem 2rem 2rem;
            box-shadow: 
                0 25px 40px -12px rgba(0, 20, 50, 0.25),
                0 0 0 1px rgba(255, 255, 255, 0.7) inset,
                0 0 0 1px rgba(180, 200, 240, 0.4);
            transition: transform 0.25s ease, box-shadow 0.3s ease;
        }

        form:hover {
            box-shadow: 
                0 30px 50px -14px rgba(0, 30, 70, 0.3),
                0 0 0 1px rgba(255, 255, 255, 0.8) inset,
                0 0 0 1px rgba(160, 190, 250, 0.6);
            transform: scale(1.003);
        }

        /* ---------- ЗАГОЛОВОК РЕГИСТРАЦИИ ---------- */
        .form-group #form_zag {
            font-size: 2rem;
            font-weight: 700;
            color: #0c1b33;
            margin-bottom: 1.8rem;
            letter-spacing: -0.03em;
            text-align: center;
            background: linear-gradient(135deg, #1e2f5e, #2b4a8c);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1.3;
        }

        /* ---------- ГРУППЫ ПОЛЕЙ ---------- */
        .form-group,
        .form-email {
            margin-bottom: 1.3rem;
        }

        /* ---------- ИНПУТЫ ---------- */
        .form-control {
            width: 100%;
            padding: 1rem 1.3rem;
            border: 1.5px solid #d9e2f0;
            border-radius: 20px;
            font-size: 1rem;
            background-color: #ffffff;
            color: #152a44;
            outline: none;
            transition: all 0.25s ease;
            box-shadow: 0 2px 6px rgba(0, 20, 40, 0.02);
        }

        .form-control::placeholder {
            color: #9aadc7;
            font-weight: 400;
            font-size: 0.95rem;
            opacity: 1;
        }

        .form-control:hover {
            border-color: #b8c9e5;
            background-color: #fcfdff;
        }

        .form-control:focus {
            border-color: #3b6eff;
            background-color: #ffffff;
            box-shadow: 0 8px 18px -8px rgba(59, 110, 255, 0.25),
                        0 0 0 4px rgba(59, 110, 255, 0.1);
            transform: scale(1.01);
        }

        /* ошибка / валидация (просто на будущее, не обязательно) */
        .form-control:invalid:not(:placeholder-shown) {
            border-color: #ff7b7b;
        }

        /* ---------- КНОПКА ---------- */
        #form_btn {
            width: 100%;
            padding: 1rem 1.5rem;
            border: none;
            border-radius: 30px;
            background: linear-gradient(135deg, #2b4a8c, #1e2f5e);
            color: white;
            font-weight: 600;
            font-size: 1.2rem;
            letter-spacing: 0.3px;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 12px 22px -8px rgba(20, 45, 90, 0.4);
            margin-top: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        #form_btn:hover {
            background: linear-gradient(135deg, #3459a0, #253d73);
            box-shadow: 0 18px 28px -10px rgba(20, 55, 120, 0.5);
            transform: translateY(-2px);
        }

        #form_btn:active {
            transform: translateY(2px);
            box-shadow: 0 6px 14px -6px rgba(20, 45, 90, 0.5);
        }

        /* ---------- ССЫЛКА НА ВХОД (ДОП. АКЦЕНТ) ---------- */
        .login-hint {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.9rem;
            color: #4f658b;
            border-top: 1px solid rgba(180, 200, 235, 0.5);
            padding-top: 1.3rem;
            letter-spacing: 0.2px;
        }

        .login-hint a {
            color: #2b4a8c;
            font-weight: 600;
            text-decoration: none;
            border-bottom: 1.5px solid transparent;
            transition: border-color 0.2s;
        }

        .login-hint a:hover {
            border-bottom-color: #2b4a8c;
        }

        /* ---------- АДАПТИВ ---------- */
        @media (max-width: 480px) {
            p {
                font-size: 1.3rem;
                padding: 0.4rem 1.5rem;
            }

            form {
                padding: 1.8rem 1.3rem 1.5rem;
                border-radius: 28px;
            }

            .form-group #form_zag {
                font-size: 1.7rem;
            }

            .form-control {
                padding: 0.9rem 1.2rem;
            }

            #form_btn {
                font-size: 1.1rem;
                padding: 0.9rem 1.2rem;
            }
        }
    </style>
</head>
<body>
    <p>Hello, Alexandr!</p>
        <form action="/pacients/register" method="post">
        <div class="form-group">
            <div id="form_zag">Регистрация</div>
        </div>
        <div class="form-group">
            <input name="login" value="" type="text" class="form-control" placeholder="Логин"/>
        </div>
        <div class="form-email">
            <input name="password" value="" type="text" class="form-control" placeholder="Пароль"/>
        </div>
        <div class="form-group">
            <input name="password_repeat" value="" type="text" class="form-control" placeholder="Повторите пароль"/>
        </div>
        <div class="form-group">
            <button type="submit" id="form_btn">Регистрация</button>
        </div>
    </form>
</body>
</html>
